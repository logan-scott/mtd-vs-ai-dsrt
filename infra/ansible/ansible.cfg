# Ansible config for the isolated MTD lab. The deploy flow points ANSIBLE_CONFIG at
# this file (see harness/provision.py) so a clean `make deploy` needs no shell export.
#
# host_key_checking is off because the isolated testbed VMs are freshly provisioned
# (no stable known_hosts) and unreachable from anywhere but the control host. Paths
# below are resolved relative to THIS file's directory (infra/ansible/).

[defaults]
host_key_checking = False
inventory = inventory.ini
roles_path = roles
interpreter_python = /usr/bin/python3
retry_files_enabled = False
stdout_callback = default

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
