# Ansible inventory for the isolated MTD testbed (copy to inventory.ini and fill in).
#
# Fill the addresses from `terraform output node_ips` (they default to the
# 172.31.66.0/24 convention below). All nodes are reached from the CONTROL host over
# vmbr9 (the control host is dual-homed and runs Ansible + the harness). The targets
# node's administrative sshd is moved to :2222 by the targets role (the fake SSH
# decoy owns :22), so it is reached with ansible_port=2222.
#
# These hosts have NO egress off 172.31.66.0/24; artifacts are pre-staged (see
# infra/README.md, "offline provisioning").

[targets]
mtd-targets ansible_host=172.31.66.10 ansible_port=2222

[attacker]
mtd-attacker ansible_host=172.31.66.20

[mtd]
mtd-mtd ansible_host=172.31.66.30

[monitoring]
mtd-monitoring ansible_host=172.31.66.40

[testbed:children]
targets
attacker
mtd
monitoring

[testbed:vars]
ansible_user=labadmin
ansible_python_interpreter=/usr/bin/python3
